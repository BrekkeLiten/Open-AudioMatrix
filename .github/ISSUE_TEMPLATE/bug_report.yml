name: Bug report
description: Something isn't working, crashes, or sounds wrong.
title: "[Bug]: "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see or hear, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Route Spotify to output channels 1-2
        2. Start routing
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Matrix editor app
        - audiomatrix CLI
        - Engine / audio output
        - Presets
        - Installing or permissions
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open AudioMatrix version
      description: From About Open AudioMatrix, or the commit if you built from source.
      placeholder: 1.2 (3)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.4, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Audio hardware
      description: Output and input devices involved, with channel counts and sample rate if you know them.
      placeholder: Focusrite Scarlett 18i8 (USB, 48 kHz), Dante Virtual Soundcard 16x16
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. Capture engine logs with:
        `log show --last 10m --predicate 'subsystem == "io.github.brekkeliten.openaudiomatrix"'`
      render: shell

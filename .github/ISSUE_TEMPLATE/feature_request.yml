name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, such as the show, room, or workflow, where you hit this.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Matrix editor app
        - audiomatrix CLI
        - Engine / audio output
        - Presets
        - Hardware support
        - Other
